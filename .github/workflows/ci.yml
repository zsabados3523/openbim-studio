          bash prototypes/s04/fluxo_b/build.sh out/s04
          export PYTHONPATH="$(python -c 'import os; print(os.path.abspath("out/s04"))')"
          OBIM_CI=1 pytest -q -rsP tests/test_s04_fluxo_b_paredes.py
      - name: Fluxo B, executável com janela (S04-T14c; bloqueia o merge)
