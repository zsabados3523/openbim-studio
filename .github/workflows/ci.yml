name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Os nomes dos jobs linux e windows são usados na regra de bloqueio de merge. Não renomear.
  # (macos não bloqueia.)
  linux:
    runs-on: ubuntu-latest
    steps:
      - name: Início (relógio)
        run: echo "T0=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: conda-incubator/setup-miniconda@be893c923ea9cf1cf7cd510fbdde27c7e18cbdcb # v4.1.0
        with:
          environment-file: environment.yml
          activate-environment: openbim
          channels: conda-forge
          conda-remove-defaults: "true"
          channel-priority: strict
          miniforge-version: latest
      - name: Testes
        shell: bash -el {0}
        run: |
          # Em caso de falha, as últimas linhas viram anotação pública (o log completo exige login no GitHub).
          set +e
          QT_QPA_PLATFORM=offscreen pytest -q tests > pytest.log 2>&1
          rc=$?
          cat pytest.log
          if [ $rc -ne 0 ]; then
            msg=$(tail -n 40 pytest.log | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
            echo "::error title=pytest falhou::$msg"
          fi
          exit $rc
      - name: Inventário de licenças e canal
        shell: bash -el {0}
        run: |
          mkdir -p out
          python scripts/license_inventory.py out/license-inventory.md
      - name: REUSE (ferramenta só no CI, ambiente separado)
        shell: bash -el {0}
        run: |
          conda create -n reuse -c conda-forge --override-channels reuse -y
          conda run -n reuse reuse lint
      - name: Pacote do app esqueleto
        run: tar czf out/app.tar.gz app/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openbim-ci-linux
          path: out/
      - name: Tempo total
        if: always()
        run: |
          echo "Tempo total do job até aqui: $(( $(date +%s) - T0 )) s" >> "$GITHUB_STEP_SUMMARY"

  windows:
    runs-on: windows-latest
    steps:
      - name: Início (relógio)
        shell: bash
        run: echo "T0=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: conda-incubator/setup-miniconda@be893c923ea9cf1cf7cd510fbdde27c7e18cbdcb # v4.1.0
        with:
          environment-file: environment.yml
          activate-environment: openbim
          channels: conda-forge
          conda-remove-defaults: "true"
          channel-priority: strict
          miniforge-version: latest
      - name: Testes
        shell: bash -el {0}
        run: |
          # Em caso de falha, as últimas linhas viram anotação pública (o log completo exige login no GitHub).
          set +e
          QT_QPA_PLATFORM=offscreen pytest -q tests > pytest.log 2>&1
          rc=$?
          cat pytest.log
          if [ $rc -ne 0 ]; then
            msg=$(tail -n 40 pytest.log | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
            echo "::error title=pytest falhou::$msg"
          fi
          exit $rc
      - name: Inventário de licenças e canal
        shell: bash -el {0}
        run: |
          mkdir -p out
          python scripts/license_inventory.py out/license-inventory.md
      - name: Instalador Windows (ambiente de runtime e NSIS)
        shell: bash -el {0}
        run: |
          mkdir -p out
          t0=$(date +%s)
          conda env create -f packaging/linux/runtime-environment.yml -p "$RUNNER_TEMP/rt" -y -q
          echo "Ambiente de runtime criado em $(( $(date +%s) - t0 )) s" | tee -a "$GITHUB_STEP_SUMMARY"
          bash packaging/windows/build_installer.sh "$RUNNER_TEMP/rt" "$RUNNER_TEMP/inst-out" 2>&1 | tail -n 15 | tee -a "$GITHUB_STEP_SUMMARY"
          ls -l "$RUNNER_TEMP/inst-out/OpenBIM-Studio-Setup.exe" | tee -a "$GITHUB_STEP_SUMMARY"
          cp "$RUNNER_TEMP/inst-out/OpenBIM-Studio-Setup.exe" "$RUNNER_TEMP/inst-out/licencas-coletadas.txt" out/
      - name: Teste do instalador (instala, abre, desinstala)
        shell: bash
        run: |
          set -e
          DEST="$(cygpath -w "$RUNNER_TEMP")\\OpenBIM Studio teste"
          "out/OpenBIM-Studio-Setup.exe" /S "/D=$DEST"
          D="$(cygpath -u "$DEST")"
          test -f "$D/app/OpenBIM-Studio.pyw" && test -f "$D/Uninstall.exe" && test -f "$D/LGPL-COMO-TROCAR.md" && test -f "$D/FONTES.md"
          test -f "$D/licenses/AGPL-3.0-or-later.txt" && test -f "$D/licenses/INVENTARIO.md"
          grep -rqi "GNU LESSER GENERAL PUBLIC LICENSE" "$D/licenses/pacotes" || { echo "::error::sem texto da LGPL em licenses/pacotes"; exit 1; }
          # abre o app (sem tela) a partir da pasta instalada, sem o ambiente conda ativo do CI
          out="$(env -i SYSTEMROOT="$SYSTEMROOT" TEMP="$TEMP" QT_QPA_PLATFORM=offscreen "$D/env/python.exe" "$D/app/OpenBIM-Studio.pyw" --selftest)"
          echo "selftest: $out"; test "$out" = "OK"
          # desinstala e confere que não sobrou nada além do próprio desinstalador
          "$D/Uninstall.exe" /S "_?=$DEST"
          sleep 5
          rm -f "$D/Uninstall.exe"
          if [ -d "$D" ] && [ -n "$(ls -A "$D")" ]; then echo "::error::sobras após desinstalar:"; ls -A "$D" | head; exit 1; fi
          echo "Instalação, abertura e desinstalação sem sobras: OK" >> "$GITHUB_STEP_SUMMARY"
      - name: Pacote do app esqueleto
        if: always()
        shell: bash
        run: |
          mkdir -p out
          tar czf out/app.tar.gz app/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: openbim-ci-windows
          path: out/
      - name: Tempo total
        if: always()
        shell: bash
        run: |
          echo "### windows: tempo total do job até aqui: $(( $(date +%s) - T0 )) s (build limpo, sem cache do ambiente conda; incremental não medido)" >> "$GITHUB_STEP_SUMMARY"

  # Melhor esforço (R12): falha vira aviso e não entra na regra de bloqueio de merge.

  macos:
    runs-on: macos-14
    continue-on-error: true
    steps:
      - name: Início (relógio)
        shell: bash
        run: echo "T0=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: conda-incubator/setup-miniconda@be893c923ea9cf1cf7cd510fbdde27c7e18cbdcb # v4.1.0
        with:
          environment-file: environment.yml
          activate-environment: openbim
          channels: conda-forge
          conda-remove-defaults: "true"
          channel-priority: strict
          miniforge-version: latest
      - name: Testes
        shell: bash -el {0}
        run: |
          # Em caso de falha, as últimas linhas viram anotação pública (o log completo exige login no GitHub).
          set +e
          QT_QPA_PLATFORM=offscreen pytest -q tests > pytest.log 2>&1
          rc=$?
          cat pytest.log
          if [ $rc -ne 0 ]; then
            msg=$(tail -n 40 pytest.log | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
            echo "::error title=pytest falhou::$msg"
          fi
          exit $rc
      - name: Inventário de licenças e canal
        shell: bash -el {0}
        run: |
          mkdir -p out
          python scripts/license_inventory.py out/license-inventory.md
      - name: Pacote do app esqueleto
        if: always()
        shell: bash
        run: |
          mkdir -p out
          tar czf out/app.tar.gz app/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: openbim-ci-macos
          path: out/
      - name: Tempo total
        if: always()
        shell: bash
        run: |
          echo "### macos: tempo total do job até aqui: $(( $(date +%s) - T0 )) s (build limpo, sem cache do ambiente conda; incremental não medido)" >> "$GITHUB_STEP_SUMMARY"
      - name: Aviso (macOS não bloqueia merge)
        if: failure()
        shell: bash
        run: |
          echo "::warning title=macOS::job macOS falhou; melhor esforço, não bloqueia merge. Registrar o motivo em docs/state/LOG.md."
          echo "AVISO: o job macOS falhou (não bloqueia merge)." >> "$GITHUB_STEP_SUMMARY"
