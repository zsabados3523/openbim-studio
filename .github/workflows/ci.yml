# SPDX-License-Identifier: AGPL-3.0-or-later
name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Uma nova alteração cancela a execução anterior do mesmo ramo (evita execuções penduradas).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Os nomes dos jobs linux e windows são usados na regra de bloqueio de merge. Não renomear.
  # (macos não bloqueia.)
  linux:
    runs-on: ubuntu-latest
    env:
      PLAT: linux-64
    steps:
      - name: Início (relógio)
        run: echo "T0=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cache de pacotes do conda
        id: cache_conda
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/conda_pkgs
          key: conda-${{ runner.os }}-${{ hashFiles('environment.yml', 'environment.*.lock', 'packaging/runtime-environment.yml', 'packaging/runtime-environment.*.lock') }}
      - name: Pasta de pacotes do conda
        shell: bash
        run: |
          echo "CONDA_PKGS_DIRS=$RUNNER_TEMP/conda_pkgs" >> "$GITHUB_ENV"
          echo "::notice title=cache de pacotes::cache-hit=${{ steps.cache_conda.outputs.cache-hit }}"
      - uses: conda-incubator/setup-miniconda@be893c923ea9cf1cf7cd510fbdde27c7e18cbdcb # v4.1.0
        with:
          activate-environment: openbim
          channels: conda-forge
          conda-remove-defaults: "true"
          channel-priority: strict
          miniforge-version: latest
      - name: Criar o ambiente (pela trava environment.linux-64.lock, se existir)
        shell: bash -el {0}
        run: |
          LOCK="environment.${PLAT}.lock"
          if [ -f "$LOCK" ]; then
            if conda env list | grep -qE '^openbim[[:space:]]'; then conda install -n openbim -y -q --file "$LOCK"; else conda create -n openbim -y -q --file "$LOCK"; fi
            echo "::notice title=ambiente::criado pela trava $LOCK"
          else
            conda env update -n openbim -f environment.yml -q
            echo "::notice title=ambiente::sem trava para ${PLAT}; criado pelo environment.yml"
          fi
      - name: Trava do ambiente (informativo; o líder traz o arquivo ao repositório)
        shell: bash -el {0}
        continue-on-error: true
        run: |
          mkdir -p out
          conda list -n openbim --explicit --md5 > "out/environment.${PLAT}.lock"
          if [ -f "environment.${PLAT}.lock" ]; then
            if diff <(grep -v '^#' "environment.${PLAT}.lock" | tr -d '\r') <(grep -v '^#' "out/environment.${PLAT}.lock" | tr -d '\r') >/dev/null; then r="igual à do repositório"; else r="DIFERENTE da do repositório (atualizar)"; fi
          else r="ainda não existe no repositório (trazer o artefato)"; fi
          echo "::notice title=trava ${PLAT}::${r}"
      - name: Localidade pt_BR na máquina descartável (T26; bloqueia o merge)
        run: |
          # RG-03: sem a localidade os testes da T26 pulariam sem avisar; agora o passo falha e a chave liga o "pulo vira falha".
          sudo locale-gen pt_BR.UTF-8 >/dev/null 2>&1 || true
          sudo update-locale >/dev/null 2>&1 || true
          if locale -a | grep -qi '^pt_BR\.utf-\?8$'; then
            echo "OBIM_LOCALIDADE_OBRIGATORIA=1" >> "$GITHUB_ENV"
            echo "::notice title=localidade pt_BR::criada"
          else
            echo "::error title=localidade pt_BR::não foi criada; os testes da T26 e do fluxo B não podem rodar"
            exit 1
          fi
      - name: Testes
        shell: bash -el {0}
        run: |
          # Em caso de falha, as últimas linhas viram anotação pública (o log completo exige login no GitHub).
          set +e
          QT_QPA_PLATFORM=offscreen pytest -q -rs tests > pytest.log 2>&1
          rc=$?
          cat pytest.log
          if [ $rc -ne 0 ]; then
            msg=$(tail -n 40 pytest.log | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
            echo "::error title=pytest falhou::$msg"
          fi
          exit $rc
      - name: Testes de tela da S03 e desenho do cubo (tela virtual e Mesa por software; bloqueia o merge)
        shell: bash -el {0}
        timeout-minutes: 20
        run: |
          # RG-03: estes testes pulavam sem tela (offscreen). Aqui rodam com Xvfb e Mesa (llvmpipe), e pulo vira falha (OBIM_TELA_OBRIGATORIA=1).
          mkdir -p out/desenho
          # Xvfb e Mesa vêm do próprio runner Ubuntu; se faltar, instala só no runner.
          command -v xvfb-run >/dev/null || sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0
          OBIM_TELA_OBRIGATORIA=1 OBIM_EXIGIR_DESENHO=1 OBIM_PNG_SAIDA=out/desenho LIBGL_ALWAYS_SOFTWARE=1 GALLIUM_DRIVER=llvmpipe \
            QT_QPA_PLATFORM=xcb xvfb-run -a -s "-screen 0 1280x1024x24" \
            pytest -q -rs tests/test_viewport_qrhi.py tests/test_viewport_camera.py tests/test_viewport_malha.py tests/test_viewport_adaptador.py tests/test_viewport_responsivo.py tests/test_viewport_selecao.py
          test -f out/desenho/cubo.png
      - name: Inventário de licenças e canal
        shell: bash -el {0}
        run: |
          mkdir -p out
          python scripts/license_inventory.py out/license-inventory.md --informativo
      - name: Teste 2 do ADR-005 (o pacote do IfcOpenShell; não bloqueia)
        shell: bash -el {0}
        continue-on-error: true
        run: |
          mkdir -p out
          python scripts/sonda_ifcopenshell.py out/sonda-ifcopenshell.txt 2>&1 | grep -v "No stream support" || true
          v=$(grep -E "^VEREDITO" out/sonda-ifcopenshell.txt || echo "VEREDITO: sem resultado")
          m=$(grep -E "^  liga em|^módulo" out/sonda-ifcopenshell.txt | cut -c1-400 | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::notice title=ifcopenshell no ${RUNNER_OS}::${v}%0A${m}"
      - name: Sonda 3b do ADR-005 (compilar com os cabeçalhos pesados do IfcOpenShell; não bloqueia)
        shell: bash -el {0}
        continue-on-error: true
        run: |
          mkdir -p out
          bash prototypes/cpp_probe_3b/run.sh out docs/acceptance/amostras/casa-simples.ifc 2>&1 | tee out/sonda-3b.txt
          echo "::notice title=sonda 3b no ${RUNNER_OS}::$(grep SONDA3B out/sonda-3b.txt || echo sem resultado)"
      - name: Módulo obimcore (S04-T03; compila com a ponte e roda o oráculo R1-a a R1-i; bloqueia o merge)
        shell: bash -el {0}
        run: |
          # Ambiente criado pela trava (T01); nada é instalado aqui. Build limpo e depois incremental, com os tempos no resumo.
          set +e
          exec > >(tee "$RUNNER_TEMP/obimcore.log") 2>&1
          trap 'rc=$?; if [ $rc -ne 0 ]; then msg=$(tail -n 40 "$RUNNER_TEMP/obimcore.log" | sed ":a;N;\$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g"); echo "::error title=obimcore falhou::$msg"; fi' EXIT
          set -e
          CLEAN=1 bash prototypes/s04/obimcore/build.sh out/s04 | tee "$RUNNER_TEMP/b1.txt"
          touch prototypes/s04/obimcore/ponte.cpp
          bash prototypes/s04/obimcore/build.sh out/s04 | tee "$RUNNER_TEMP/b2.txt"
          echo "obimcore ${RUNNER_OS}: limpo $(grep OBIMCORE "$RUNNER_TEMP/b1.txt") | incremental $(grep OBIMCORE "$RUNNER_TEMP/b2.txt")" >> "$GITHUB_STEP_SUMMARY"
          export PYTHONPATH="$(python -c 'import os; print(os.path.abspath("out/s04"))')"
          export OBIM_S04_OBRIGATORIO=1  # pulo vira falha (T04c entregou versao()["registro_ifc4"])
          QT_QPA_PLATFORM=offscreen pytest -q -rs tests/test_s04_ponte.py
      - name: Viewport C++ (S04-T06/T07; bloqueia o merge)
        shell: bash -el {0}
        timeout-minutes: 30
        run: |
          # O oráculo abre a tela virtual sozinho em subprocesso (xvfb-run no Linux; no Windows, WARP). Nada na tela real.
          export PYTHONPATH="$(python -c 'import os; print(os.path.abspath("out/s04"))')"
          OBIM_S04_OBRIGATORIO=1 OBIM_S04_VIEWPORT_OBRIGATORIO=1 OBIM_S04_T07B_OBRIGATORIO=1 OBIM_S04_T08_OBRIGATORIO=1 OBIM_S04_T09_OBRIGATORIO=1 OBIM_S04_T10_OBRIGATORIO=1 OBIM_S04_T10B_OBRIGATORIO=1 OBIM_S04_T10C_OBRIGATORIO=1 OBIM_S04_T11_OBRIGATORIO=1 OBIM_S04_T11C_OBRIGATORIO=1 OBIM_S04_T11B_OBRIGATORIO=1 OBIM_S04_T12_OBRIGATORIO=1 OBIM_S04_T16_OBRIGATORIO=1 pytest -q -rsP tests/test_s04_viewport.py tests/test_s04_viewport_b.py tests/test_s04_cena.py tests/test_s04_selecao.py tests/test_s04_selecao_c.py tests/test_s04_profundidade.py tests/test_s04_fluxo_a.py tests/test_s04_metas.py tests/test_s04_abertura.py
      - name: Fluxo B, paredes em C++ (S04-T13; bloqueia o merge)
        shell: bash -el {0}
        timeout-minutes: 20
        run: |
          # Sem janela: compara o IFC da biblioteca C++ com o do fluxo A (saída igual).
          bash prototypes/s04/fluxo_b/build.sh out/s04
          export PYTHONPATH="$(python -c 'import os; print(os.path.abspath("out/s04"))')"
          export OBIM_S04_T14A_OBRIGATORIO=1
          OBIM_S04_T13_OBRIGATORIO=1 OBIM_S04_T11C_OBRIGATORIO=1 OBIM_S04_OBRIGATORIO=1 pytest -q -rsP tests/test_s04_fluxo_b_paredes.py
      - name: Sonda da thread de desenho (S04-T05; informativo, não bloqueia)
        shell: bash -el {0}
        continue-on-error: true
        timeout-minutes: 5
        run: |
          # Desenho por software (Linux: tela virtual + Mesa; Windows: WARP). Nenhuma janela na tela real.
          mkdir -p out/s04_sonda
          B="$(python -c 'import os; print(os.path.abspath("out/s04_sonda/build"))')"; O="$(python -c 'import os; print(os.path.abspath("out/s04_sonda"))')"
          if [ "${RUNNER_OS}" = "Windows" ]; then GEN=(-A x64); else GEN=(-G Ninja); fi
          cmake -S prototypes/s04/sonda_desenho -B "$B" "${GEN[@]}" -DCMAKE_BUILD_TYPE=Release -DOBIM_SAIDA="$O" -DCMAKE_PREFIX_PATH="$CONDA_PREFIX"
          cmake --build "$B" --config Release
          QT_QPA_PLATFORM=xcb LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s "-screen 0 1280x800x24" python prototypes/s04/sonda_desenho/sonda.py "$O" out/s04_sonda/sonda.json; rc=$?
          cat out/s04_sonda/sonda.json || true
          echo "::notice title=sonda da thread de desenho no ${RUNNER_OS}::$(python -c "import json; r=json.load(open('out/s04_sonda/sonda.json')); print('rc=$rc meta_atingida=%s' % r.get('meta_atingida'), {k:v.get('maior_intervalo_ms') for k,v in r['fases'].items() if isinstance(v,dict)})" || echo sem resultado)"
          true
      - name: REUSE (ferramenta só no CI, ambiente separado)
        shell: bash -el {0}
        run: |
          conda create -n reuse -c conda-forge --override-channels reuse=6.2.0 -y
          conda run -n reuse reuse lint
      - name: Gravação do roteiro (experimento T12; não bloqueia)
        shell: bash -el {0}
        continue-on-error: true
        run: |
          mkdir -p out/video
          QT_QPA_PLATFORM=offscreen python tests/video/gravar_roteiro.py out/video docs/acceptance/amostras/casa-simples.ifc
      - name: Pacote do app esqueleto
        run: tar czf out/app.tar.gz app/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openbim-ci-linux
          path: out/
          retention-days: 7  # build de teste, não é versão publicada (decisão do PO, lote opus 2)
      - name: Tempo total
        if: always()
        run: |
          echo "Tempo total do job até aqui: $(( $(date +%s) - T0 )) s" >> "$GITHUB_STEP_SUMMARY"

  # Windows em jobs paralelos (T25). O job `windows` no fim só junta o resultado: o nome é o usado na regra de bloqueio de merge.
  windows-testes:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Início (relógio)
        shell: bash
        run: echo "T0=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/ambiente-windows
      - name: Testes
        shell: bash -el {0}
        run: |
          # Em caso de falha, as últimas linhas viram anotação pública (o log completo exige login no GitHub).
          set +e
          QT_QPA_PLATFORM=offscreen pytest -q -rs tests > pytest.log 2>&1
          rc=$?
          cat pytest.log
          if [ $rc -ne 0 ]; then
            msg=$(tail -n 40 pytest.log | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
            echo "::error title=pytest falhou::$msg"
          fi
          exit $rc
      - name: Desenho do cubo com WARP do Direct3D 11 (T25; informativo, não bloqueia)
        shell: bash -el {0}
        continue-on-error: true
        run: |
          mkdir -p out/desenho
          set +e
          # Tentativa 1: pede o rasterizador por software (WARP); tentativa 2: adaptador padrão do runner.
          for modo in warp padrao; do
            if [ "$modo" = warp ]; then export QSG_RHI_PREFER_SOFTWARE_RENDERER=1; else unset QSG_RHI_PREFER_SOFTWARE_RENDERER; fi
            OBIM_EXIGIR_DESENHO=1 OBIM_PNG_SAIDA=out/desenho QT_QPA_PLATFORM=windows QSG_RHI_BACKEND=d3d11 \
              pytest -q -s -rs tests/test_viewport_qrhi.py > "out/desenho/pytest-desenho-$modo.log" 2>&1
            rc=$?
            cat "out/desenho/pytest-desenho-$modo.log"
            if [ $rc -eq 0 ] && [ -f out/desenho/cubo.png ]; then r="DESENHA no modo $modo ($(grep 'RHI backend' "out/desenho/pytest-desenho-$modo.log" | head -n 1))"; break; fi
            r="NÃO DESENHA (código $rc, último modo $modo): $(tail -n 3 "out/desenho/pytest-desenho-$modo.log" | tr '\n' ' ' | cut -c1-300)"
          done
          echo "::notice title=desenho do cubo no Windows::${r}"
          echo "Desenho do cubo (Windows): ${r}" >> "$GITHUB_STEP_SUMMARY"
          exit 0
      - name: Inventário de licenças e canal
        shell: bash -el {0}
        run: |
          mkdir -p out
          python scripts/license_inventory.py out/license-inventory.md --informativo
      - name: Teste 2 do ADR-005 (o pacote do IfcOpenShell; não bloqueia)
        shell: bash -el {0}
        continue-on-error: true
        run: |
          mkdir -p out
          python scripts/sonda_ifcopenshell.py out/sonda-ifcopenshell.txt 2>&1 | grep -v "No stream support" || true
          v=$(grep -E "^VEREDITO" out/sonda-ifcopenshell.txt || echo "VEREDITO: sem resultado")
          m=$(grep -E "^  liga em|^módulo" out/sonda-ifcopenshell.txt | cut -c1-400 | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::notice title=ifcopenshell no ${RUNNER_OS}::${v}%0A${m}"
      - name: Sonda 3b do ADR-005 (compilar com os cabeçalhos pesados do IfcOpenShell; não bloqueia)
        shell: bash -el {0}
        continue-on-error: true
        run: |
          mkdir -p out
          bash prototypes/cpp_probe_3b/run.sh out docs/acceptance/amostras/casa-simples.ifc 2>&1 | tee out/sonda-3b.txt
          echo "::notice title=sonda 3b no ${RUNNER_OS}::$(grep SONDA3B out/sonda-3b.txt || echo sem resultado)"
      - name: Gravação do roteiro (experimento T12; não bloqueia)
        shell: bash -el {0}
        continue-on-error: true
        run: |
          mkdir -p out/video
          QT_QPA_PLATFORM=offscreen python tests/video/gravar_roteiro.py out/video docs/acceptance/amostras/casa-simples.ifc
      - name: Pacote do que o job gerou
        if: always()
        shell: bash
        run: |
          mkdir -p out
          tar czf out/app.tar.gz app/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: openbim-ci-windows-testes
          path: out/
          retention-days: 7  # build de teste, não é versão publicada (decisão do PO, lote opus 2)
      - name: Tempo total
        if: always()
        shell: bash
        run: |
          echo "### windows-testes: tempo total do job até aqui: $(( $(date +%s) - T0 )) s" >> "$GITHUB_STEP_SUMMARY"

  windows-viewport-a:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Início (relógio)
        shell: bash
        run: echo "T0=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/ambiente-windows
      - name: Módulo obimcore (S04-T03; compila com a ponte e roda o oráculo R1-a a R1-i; bloqueia o merge)
        shell: bash -el {0}
        run: |
          # Ambiente criado pela trava (T01); nada é instalado aqui. Build limpo e depois incremental, com os tempos no resumo.
          set +e
          exec > >(tee "$RUNNER_TEMP/obimcore.log") 2>&1
          trap 'rc=$?; if [ $rc -ne 0 ]; then msg=$(tail -n 40 "$RUNNER_TEMP/obimcore.log" | sed ":a;N;\$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g"); echo "::error title=obimcore falhou::$msg"; fi' EXIT
          set -e
          CLEAN=1 bash prototypes/s04/obimcore/build.sh out/s04 | tee "$RUNNER_TEMP/b1.txt"
          touch prototypes/s04/obimcore/ponte.cpp
          bash prototypes/s04/obimcore/build.sh out/s04 | tee "$RUNNER_TEMP/b2.txt"
          echo "obimcore ${RUNNER_OS}: limpo $(grep OBIMCORE "$RUNNER_TEMP/b1.txt") | incremental $(grep OBIMCORE "$RUNNER_TEMP/b2.txt")" >> "$GITHUB_STEP_SUMMARY"
          export PYTHONPATH="$(python -c 'import os; print(os.path.abspath("out/s04"))')"
          export OBIM_S04_OBRIGATORIO=1  # pulo vira falha (T04c entregou versao()["registro_ifc4"])
          QT_QPA_PLATFORM=offscreen pytest -q -rs tests/test_s04_ponte.py
      - name: Viewport C++ (parte A; S04-T06/T07; bloqueia o merge)
        shell: bash -el {0}
        timeout-minutes: 30
        run: |
          # O oráculo abre a tela virtual sozinho em subprocesso (xvfb-run no Linux; no Windows, WARP). Nada na tela real.
          export PYTHONPATH="$(python -c 'import os; print(os.path.abspath("out/s04"))')"
          export OBIM_S04_TELA_VIRTUAL=1 QSG_RHI_BACKEND=d3d11 QSG_RHI_PREFER_SOFTWARE_RENDERER=1  # WARP, como no passo do cubo
          OBIM_S04_OBRIGATORIO=1 OBIM_S04_VIEWPORT_OBRIGATORIO=1 OBIM_S04_T07B_OBRIGATORIO=1 OBIM_S04_T08_OBRIGATORIO=1 OBIM_S04_T09_OBRIGATORIO=1 OBIM_S04_T10_OBRIGATORIO=1 OBIM_S04_T10B_OBRIGATORIO=1 OBIM_S04_T10C_OBRIGATORIO=1 OBIM_S04_T11_OBRIGATORIO=1 OBIM_S04_T11C_OBRIGATORIO=1 OBIM_S04_T11B_OBRIGATORIO=1 OBIM_S04_T12_OBRIGATORIO=1 OBIM_S04_T16_OBRIGATORIO=1 pytest -q -rsP --durations=10 tests/test_s04_fluxo_a.py tests/test_s04_profundidade.py tests/test_s04_viewport_b.py
      - name: Pacote do que o job gerou
        if: always()
        shell: bash
        run: |
          mkdir -p out
          tar czf out/app.tar.gz app/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: openbim-ci-windows-viewport-a
          path: out/
          retention-days: 7  # build de teste, não é versão publicada (decisão do PO, lote opus 2)
      - name: Tempo total
        if: always()
        shell: bash
        run: |
          echo "### windows-viewport-a: tempo total do job até aqui: $(( $(date +%s) - T0 )) s" >> "$GITHUB_STEP_SUMMARY"

  windows-viewport-b:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Início (relógio)
        shell: bash
        run: echo "T0=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/ambiente-windows
      - name: Módulo obimcore (só o build, para os testes deste job; a ponte é testada no job windows-viewport-a)
        shell: bash -el {0}
        run: CLEAN=1 bash prototypes/s04/obimcore/build.sh out/s04
      - name: Viewport C++ (parte B; S04-T06/T07; bloqueia o merge)
        shell: bash -el {0}
        timeout-minutes: 30
        run: |
          # O oráculo abre a tela virtual sozinho em subprocesso (xvfb-run no Linux; no Windows, WARP). Nada na tela real.
          export PYTHONPATH="$(python -c 'import os; print(os.path.abspath("out/s04"))')"
          export OBIM_S04_TELA_VIRTUAL=1 QSG_RHI_BACKEND=d3d11 QSG_RHI_PREFER_SOFTWARE_RENDERER=1  # WARP, como no passo do cubo
          OBIM_S04_OBRIGATORIO=1 OBIM_S04_VIEWPORT_OBRIGATORIO=1 OBIM_S04_T07B_OBRIGATORIO=1 OBIM_S04_T08_OBRIGATORIO=1 OBIM_S04_T09_OBRIGATORIO=1 OBIM_S04_T10_OBRIGATORIO=1 OBIM_S04_T10B_OBRIGATORIO=1 OBIM_S04_T10C_OBRIGATORIO=1 OBIM_S04_T11_OBRIGATORIO=1 OBIM_S04_T11C_OBRIGATORIO=1 OBIM_S04_T11B_OBRIGATORIO=1 OBIM_S04_T12_OBRIGATORIO=1 OBIM_S04_T16_OBRIGATORIO=1 pytest -q -rsP --durations=10 tests/test_s04_viewport.py tests/test_s04_cena.py tests/test_s04_selecao.py tests/test_s04_selecao_c.py tests/test_s04_metas.py tests/test_s04_abertura.py
      - name: Pacote do que o job gerou
        if: always()
        shell: bash
        run: |
          mkdir -p out
          tar czf out/app.tar.gz app/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: openbim-ci-windows-viewport-b
          path: out/
          retention-days: 7  # build de teste, não é versão publicada (decisão do PO, lote opus 2)
      - name: Tempo total
        if: always()
        shell: bash
        run: |
          echo "### windows-viewport-b: tempo total do job até aqui: $(( $(date +%s) - T0 )) s" >> "$GITHUB_STEP_SUMMARY"

  windows-fluxo-b:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Início (relógio)
        shell: bash
        run: echo "T0=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/ambiente-windows
      - name: Módulo obimcore (só o build, para os testes deste job; a ponte é testada no job windows-viewport-a)
        shell: bash -el {0}
        run: CLEAN=1 bash prototypes/s04/obimcore/build.sh out/s04
      - name: Fluxo B, paredes em C++ (S04-T13; bloqueia o merge)
        shell: bash -el {0}
        timeout-minutes: 20
        run: |
          # Sem janela: compara o IFC da biblioteca C++ com o do fluxo A (saída igual).
          bash prototypes/s04/fluxo_b/build.sh out/s04
          export PYTHONPATH="$(python -c 'import os; print(os.path.abspath("out/s04"))')"
          export OBIM_S04_T14A_OBRIGATORIO=1
          OBIM_S04_T13_OBRIGATORIO=1 OBIM_S04_T11C_OBRIGATORIO=1 OBIM_S04_OBRIGATORIO=1 pytest -q -rsP tests/test_s04_fluxo_b_paredes.py
      - name: Pacote do que o job gerou
        if: always()
        shell: bash
        run: |
          mkdir -p out
          tar czf out/app.tar.gz app/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: openbim-ci-windows-fluxo-b
          path: out/
          retention-days: 7  # build de teste, não é versão publicada (decisão do PO, lote opus 2)
      - name: Tempo total
        if: always()
        shell: bash
        run: |
          echo "### windows-fluxo-b: tempo total do job até aqui: $(( $(date +%s) - T0 )) s" >> "$GITHUB_STEP_SUMMARY"

  # Informativo: fora da regra de bloqueio e fora do caminho do `windows` (a sonda esgota 3 min por conta própria).
  windows-sonda:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Início (relógio)
        shell: bash
        run: echo "T0=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/ambiente-windows
      - name: Módulo obimcore (só o build, para os testes deste job; a ponte é testada no job windows-viewport-a)
        shell: bash -el {0}
        run: CLEAN=1 bash prototypes/s04/obimcore/build.sh out/s04
      - name: Sonda da thread de desenho (S04-T05; informativo, não bloqueia)
        shell: bash -el {0}
        continue-on-error: true
        timeout-minutes: 5
        run: |
          # Desenho por software (Linux: tela virtual + Mesa; Windows: WARP). Nenhuma janela na tela real.
          mkdir -p out/s04_sonda
          B="$(python -c 'import os; print(os.path.abspath("out/s04_sonda/build"))')"; O="$(python -c 'import os; print(os.path.abspath("out/s04_sonda"))')"
          if [ "${RUNNER_OS}" = "Windows" ]; then GEN=(-A x64); else GEN=(-G Ninja); fi
          cmake -S prototypes/s04/sonda_desenho -B "$B" "${GEN[@]}" -DCMAKE_BUILD_TYPE=Release -DOBIM_SAIDA="$O" -DCMAKE_PREFIX_PATH="$CONDA_PREFIX"
          cmake --build "$B" --config Release
          QT_QPA_PLATFORM=windows RHI=d3d11 python prototypes/s04/sonda_desenho/sonda.py "$O" out/s04_sonda/sonda.json; rc=$?
          cat out/s04_sonda/sonda.json || true
          echo "::notice title=sonda da thread de desenho no ${RUNNER_OS}::$(python -c "import json; r=json.load(open('out/s04_sonda/sonda.json')); print('rc=$rc meta_atingida=%s' % r.get('meta_atingida'), {k:v.get('maior_intervalo_ms') for k,v in r['fases'].items() if isinstance(v,dict)})" || echo sem resultado)"
          true
      - name: Pacote do que o job gerou
        if: always()
        shell: bash
        run: |
          mkdir -p out
          tar czf out/app.tar.gz app/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: openbim-ci-windows-sonda
          path: out/
          retention-days: 7  # build de teste, não é versão publicada (decisão do PO, lote opus 2)
      - name: Tempo total
        if: always()
        shell: bash
        run: |
          echo "### windows-sonda: tempo total do job até aqui: $(( $(date +%s) - T0 )) s" >> "$GITHUB_STEP_SUMMARY"

  # Mantém o nome `windows` (regra de bloqueio de merge): passa só se TODOS os jobs paralelos acima passarem.
  windows:
    if: always()
    needs: [windows-testes, windows-viewport-a, windows-viewport-b, windows-fluxo-b]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Todos os jobs do Windows passaram
        env:
          RESULTADOS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "resultados: $RESULTADOS"
          for r in $RESULTADOS; do [ "$r" = success ] || { echo "::error title=windows::algum job do Windows não passou ($RESULTADOS)"; exit 1; }; done

  # Instalador do Windows em job próprio: roda ao mesmo tempo que o job windows, em vez de depois dele.
  instalador-windows:
    runs-on: windows-latest
    env:
      PLAT: win-64
    timeout-minutes: 60
    steps:
      - name: Início (relógio)
        shell: bash
        run: echo "T0=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Detecta se o empacotamento mudou (decide se o instalador é montado e testado)
        id: detecta
        shell: bash
        env:
          EVENTO: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
        run: |
          # push (main) e tag: sempre. Pull request: só se o diff contra a base toca o empacotamento. Na dúvida, true.
          r=true; motivo="evento $EVENTO"
          if [ "$EVENTO" = "pull_request" ]; then
            if git fetch --no-tags --depth=1 origin "$BASE" 2>/dev/null && lista=$(git diff --name-only FETCH_HEAD HEAD); then
              if echo "$lista" | grep -qE '^(packaging/|app/|environment[^/]*\.yml$|environment\.[^/]*\.lock$|pyproject[^/]*$|\.github/workflows/ci\.yml$|scripts/(prune_packages|license_inventory|collect_package_licenses)\.py$|LICENSES/)'; then motivo="o PR mexe no empacotamento"; else r=false; motivo="o PR não mexe no empacotamento"; fi
            else motivo="não consegui comparar com a base"; fi
          fi
          echo "instalador=$r" >> "$GITHUB_OUTPUT"
          echo "::notice title=instalador::instalador=$r ($motivo)"
      - name: Cache de pacotes do conda
        if: steps.detecta.outputs.instalador == 'true'
        id: cache_conda
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/conda_pkgs
          key: conda-${{ runner.os }}-${{ hashFiles('environment.yml', 'environment.*.lock', 'packaging/runtime-environment.yml', 'packaging/runtime-environment.*.lock') }}
      - name: Pasta de pacotes do conda
        if: steps.detecta.outputs.instalador == 'true'
        shell: bash
        run: |
          echo "CONDA_PKGS_DIRS=$RUNNER_TEMP/conda_pkgs" >> "$GITHUB_ENV"
          echo "::notice title=cache de pacotes::cache-hit=${{ steps.cache_conda.outputs.cache-hit }}"
      - uses: conda-incubator/setup-miniconda@be893c923ea9cf1cf7cd510fbdde27c7e18cbdcb # v4.1.0
        if: steps.detecta.outputs.instalador == 'true'
        with:
          activate-environment: openbim
          channels: conda-forge
          conda-remove-defaults: "true"
          channel-priority: strict
          miniforge-version: latest
      - name: Instalador Windows (ambiente de runtime e NSIS)
        if: steps.detecta.outputs.instalador == 'true'
        shell: bash -el {0}
        run: |
          trap 'rc=$?; if [ $rc -ne 0 ]; then msg=$(tail -n 40 "$RUNNER_TEMP/passo.log" | sed ":a;N;\$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g"); echo "::error title=instalador falhou::$msg"; fi' EXIT
          exec > >(tee "$RUNNER_TEMP/passo.log") 2>&1
          mkdir -p out
          t0=$(date +%s)
          # Ambiente de runtime (o que vai ao usuário): pela trava, se existir (F0-RG-10; PO.md A3); senão pelo .yml
          LOCK="packaging/runtime-environment.${PLAT}.lock"
          if [ -f "$LOCK" ]; then conda create -p "$RUNNER_TEMP/rt" --file "$LOCK" -y -q; echo "::notice title=ambiente de runtime::criado pela trava $LOCK"
          else conda env create -f packaging/runtime-environment.yml -p "$RUNNER_TEMP/rt" -y -q; echo "::notice title=ambiente de runtime::sem trava para ${PLAT}; criado pelo .yml"; fi
          conda list -p "$RUNNER_TEMP/rt" --explicit --md5 > "out/runtime-environment.${PLAT}.lock"
          if [ -f "$LOCK" ] && diff <(grep -v '^#' "$LOCK" | tr -d '\r') <(grep -v '^#' "out/runtime-environment.${PLAT}.lock" | tr -d '\r') >/dev/null; then echo "::notice title=trava do runtime ${PLAT}::igual à do repositório"
          else echo "::notice title=trava do runtime ${PLAT}::ausente ou DIFERENTE da do repositório (atualizar com o conteúdo abaixo)"; echo "=====INICIO-TRAVA-RUNTIME-${PLAT}====="; tr -d '\r' < "out/runtime-environment.${PLAT}.lock"; echo "=====FIM-TRAVA-RUNTIME-${PLAT}====="; fi
          echo "Ambiente de runtime criado em $(( $(date +%s) - t0 )) s" | tee -a "$GITHUB_STEP_SUMMARY"
          # NSIS não vem mais no windows-latest (Server 2025): usa o pacote conda-forge `nsis` (só ferramenta, não entra no instalador)
          conda create -n nsis -c conda-forge --override-channels nsis=3.12=h4c425fd_1 -y -q
          export MAKENSIS="$(find "$(conda info --base)/envs/nsis" -name makensis.exe | head -n 1)"
          echo "makensis: $MAKENSIS"
          bash packaging/windows/build_installer.sh "$RUNNER_TEMP/rt" "$RUNNER_TEMP/inst-out" 2>&1 | tail -n 45 | tee -a "$GITHUB_STEP_SUMMARY"
          ls -l "$RUNNER_TEMP/inst-out/OpenBIM-Studio-Setup.exe" | tee -a "$GITHUB_STEP_SUMMARY"
          cp "$RUNNER_TEMP/inst-out/OpenBIM-Studio-Setup.exe" "$RUNNER_TEMP/inst-out/licencas-coletadas.txt" out/
      - name: Teste do instalador (instala, abre, desinstala)
        if: steps.detecta.outputs.instalador == 'true'
        shell: bash
        timeout-minutes: 30
        run: |
          set +e
          timeout 1500 bash packaging/windows/test_installer.sh "$PWD/out/OpenBIM-Studio-Setup.exe" "$(cygpath -w "$RUNNER_TEMP")\\OpenBIM-teste" > "$RUNNER_TEMP/teste.log" 2>&1
          rc=$?
          cat "$RUNNER_TEMP/teste.log"
          if [ $rc -ne 0 ]; then
            msg=$(tail -n 40 "$RUNNER_TEMP/teste.log" | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
            echo "::error title=teste do instalador falhou (código $rc)::$msg"
            exit $rc
          fi
          echo "Instalação, abertura e desinstalação sem sobras: OK" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.detecta.outputs.instalador == 'true'
        with:
          name: openbim-instalador-windows
          path: out/
          retention-days: 7  # build de teste, não é versão publicada (decisão do PO, lote opus 2)
      - name: Tempo total
        if: always()
        shell: bash
        run: |
          echo "### instalador windows: tempo total do job até aqui: $(( $(date +%s) - T0 )) s" >> "$GITHUB_STEP_SUMMARY"

  # Melhor esforço (R12): falha vira aviso e não entra na regra de bloqueio de merge.

  macos:
    runs-on: macos-14
    continue-on-error: true
    steps:
      - name: Início (relógio)
        shell: bash
        run: echo "T0=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: conda-incubator/setup-miniconda@be893c923ea9cf1cf7cd510fbdde27c7e18cbdcb # v4.1.0
        with:
          environment-file: environment.yml
          activate-environment: openbim
          channels: conda-forge
          conda-remove-defaults: "true"
          channel-priority: strict
          miniforge-version: latest
      - name: Testes
        shell: bash -el {0}
        run: |
          # Em caso de falha, as últimas linhas viram anotação pública (o log completo exige login no GitHub).
          set +e
          QT_QPA_PLATFORM=offscreen pytest -q -rs tests > pytest.log 2>&1
          rc=$?
          cat pytest.log
          if [ $rc -ne 0 ]; then
            msg=$(tail -n 40 pytest.log | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
            echo "::error title=pytest falhou::$msg"
          fi
          exit $rc
      - name: Inventário de licenças e canal
        shell: bash -el {0}
        run: |
          mkdir -p out
          python scripts/license_inventory.py out/license-inventory.md --informativo
      - name: Pacote do app esqueleto
        if: always()
        shell: bash
        run: |
          mkdir -p out
          tar czf out/app.tar.gz app/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: openbim-ci-macos
          path: out/
          retention-days: 7  # build de teste, não é versão publicada (decisão do PO, lote opus 2)
      - name: Tempo total
        if: always()
        shell: bash
        run: |
          echo "### macos: tempo total do job até aqui: $(( $(date +%s) - T0 )) s (build limpo, sem cache do ambiente conda; incremental não medido)" >> "$GITHUB_STEP_SUMMARY"
      - name: Aviso (macOS não bloqueia merge)
        if: failure()
        shell: bash
        run: |
          echo "::warning title=macOS::job macOS falhou; melhor esforço, não bloqueia merge. Registrar o motivo em docs/state/LOG.md."
          echo "AVISO: o job macOS falhou (não bloqueia merge)." >> "$GITHUB_STEP_SUMMARY"

  # Gera o AppImage (pacote Linux) a cada alteração. Não bloqueia o merge; o nome do job não é usado na regra.
  appimage:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Início (relógio)
        run: echo "T0=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cache de pacotes do conda
        id: cache_conda
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/conda_pkgs
          key: conda-${{ runner.os }}-${{ hashFiles('environment.yml', 'environment.*.lock', 'packaging/runtime-environment.yml', 'packaging/runtime-environment.*.lock') }}
      - name: Pasta de pacotes do conda
        shell: bash
        run: |
          echo "CONDA_PKGS_DIRS=$RUNNER_TEMP/conda_pkgs" >> "$GITHUB_ENV"
          echo "::notice title=cache de pacotes::cache-hit=${{ steps.cache_conda.outputs.cache-hit }}"
      - uses: conda-incubator/setup-miniconda@be893c923ea9cf1cf7cd510fbdde27c7e18cbdcb # v4.1.0
        with:
          activate-environment: openbim-runtime
          channels: conda-forge
          conda-remove-defaults: "true"
          channel-priority: strict
          miniforge-version: latest
      - name: Criar o ambiente de runtime (pela trava, se existir; F0-RG-10, PO.md A3)
        shell: bash -el {0}
        run: |
          PLAT=linux-64
          LOCK="packaging/runtime-environment.${PLAT}.lock"
          if [ -f "$LOCK" ]; then conda install -n openbim-runtime -y -q --file "$LOCK"; echo "::notice title=ambiente de runtime::criado pela trava $LOCK"
          else conda env update -n openbim-runtime -f packaging/runtime-environment.yml -q; echo "::notice title=ambiente de runtime::sem trava para ${PLAT}; criado pelo .yml"; fi
          mkdir -p out
          conda list -n openbim-runtime --explicit --md5 > "out/runtime-environment.${PLAT}.lock"
          if [ -f "$LOCK" ] && diff <(grep -v '^#' "$LOCK" | tr -d '\r') <(grep -v '^#' "out/runtime-environment.${PLAT}.lock" | tr -d '\r') >/dev/null; then echo "::notice title=trava do runtime ${PLAT}::igual à do repositório"
          else echo "::notice title=trava do runtime ${PLAT}::ausente ou DIFERENTE da do repositório (atualizar com o conteúdo abaixo)"; echo "=====INICIO-TRAVA-RUNTIME-${PLAT}====="; tr -d '\r' < "out/runtime-environment.${PLAT}.lock"; echo "=====FIM-TRAVA-RUNTIME-${PLAT}====="; fi
      - name: Ferramenta appimagetool (versão fixa 1.9.1, sha256 conferido)
        run: |
          curl -fsSL -o appimagetool.AppImage https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  appimagetool.AppImage" | sha256sum -c -
          chmod +x appimagetool.AppImage
      - name: Montar o AppImage
        shell: bash -el {0}
        run: |
          set +e
          RUNTIME_ENV="$CONDA_PREFIX" bash packaging/linux/build_appimage.sh "$RUNNER_TEMP/ai" "$PWD/appimagetool.AppImage" > ai.log 2>&1
          rc=$?
          tail -n 20 ai.log
          if [ $rc -ne 0 ]; then
            msg=$(tail -n 40 ai.log | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
            echo "::error title=AppImage falhou::$msg"
            exit $rc
          fi
      - name: libfuse2 (o AppImage montado de verdade precisa dela; sem ela o usuário vê o programa não abrir)
        run: sudo apt-get install -y libfuse2t64
      - name: Testar o AppImage (licenças, extração, troca de biblioteca, tamanho)
        run: |
          set +e
          IMG="$RUNNER_TEMP/ai/OpenBIM-Studio-x86_64.AppImage"
          OBIM_EXIGIR_FUSE=1 QT_QPA_PLATFORM=offscreen timeout 900 bash packaging/linux/test_appimage.sh "$IMG" > teste-ai.log 2>&1
          rc=$?
          cat teste-ai.log
          if [ $rc -ne 0 ]; then
            msg=$(tail -n 45 teste-ai.log | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
            echo "::error title=teste do AppImage falhou::$msg"
            exit $rc
          fi
          size=$(stat -c %s "$IMG"); echo "AppImage: $((size/1000000)) MB"
          test "$size" -le 600000000 || { echo "::error::AppImage acima de 600 MB"; exit 1; }
          echo "::notice title=AppImage::$((size/1000000)) MB, testes de licença e troca de biblioteca OK"
      - name: Empacotar (tar.gz mantém a permissão de executar)
        run: |
          mkdir -p out
          tar -czf out/OpenBIM-Studio-x86_64.AppImage.tar.gz -C "$RUNNER_TEMP/ai" OpenBIM-Studio-x86_64.AppImage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openbim-appimage
          path: out/
          retention-days: 7  # build de teste, não é versão publicada (decisão do PO, lote opus 2)
      - name: Tempo total
        if: always()
        run: echo "::notice title=tempo do job appimage::$(( $(date +%s) - T0 )) s"
