[pytest]
testpaths = tests
# Nenhum marcador próprio por enquanto (só parametrize, skipif e xfail do pytest); marcador novo entra aqui.
# `--strict-markers` faz um marcador digitado errado falhar na coleta em vez de ser ignorado.
addopts = --strict-markers
markers =
