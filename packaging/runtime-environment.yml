# Ambiente de RUNTIME para o pacote Linux (ADR-005 §5 item 6). Mesmas versoes fixas de
# environment.yml, sem compiladores, cmake, ninja, nanobind e pytest. Fonte unica: conda-forge.
name: openbim-runtime
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.12
  - occt=8.0.1
  - ifcopenshell=0.9.0
  - pyside6=6.11.2
  - qt6-main=6.11.2
