  # Informativo: fora da regra de bloqueio e fora do caminho do `windows` (a sonda esgota 3 min por conta própria).
  windows-sonda:
    needs: windows  # T23c: informativo; começa depois da fila crítica para não tomar vaga de máquina dela
    if: ${{ !cancelled() }}
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Início (relógio)
        shell: bash
        run: echo "T0=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/ambiente-windows
      - name: Módulo obimcore (só o build, para os testes deste job; a ponte é testada no job windows-viewport-a)
        shell: bash -elo pipefail {0}
        run: CLEAN=1 bash prototypes/s04/obimcore/build.sh out/s04
      - name: Sonda da thread de desenho (S04-T05; informativo, não bloqueia)
        shell: bash -elo pipefail {0}
        continue-on-error: true
        timeout-minutes: 5
        run: |
          # Desenho por software (Linux: tela virtual + Mesa; Windows: WARP). Nenhuma janela na tela real.
          mkdir -p out/s04_sonda
          B="$(python -c 'import os; print(os.path.abspath("out/s04_sonda/build"))')"; O="$(python -c 'import os; print(os.path.abspath("out/s04_sonda"))')"
          if [ "${RUNNER_OS}" = "Windows" ]; then GEN=(-A x64); else GEN=(-G Ninja); fi
          cmake -S prototypes/s04/sonda_desenho -B "$B" "${GEN[@]}" -DCMAKE_BUILD_TYPE=Release -DOBIM_SAIDA="$O" -DCMAKE_PREFIX_PATH="$CONDA_PREFIX"
          cmake --build "$B" --config Release
          QT_QPA_PLATFORM=windows RHI=d3d11 python prototypes/s04/sonda_desenho/sonda.py "$O" out/s04_sonda/sonda.json; rc=$?
          cat out/s04_sonda/sonda.json || true
          echo "::notice title=sonda da thread de desenho no ${RUNNER_OS}::$(python -c "import json; r=json.load(open('out/s04_sonda/sonda.json')); print('rc=$rc meta_atingida=%s' % r.get('meta_atingida'), {k:v.get('maior_intervalo_ms') for k,v in r['fases'].items() if isinstance(v,dict)})" || echo sem resultado)"
          true
      - name: Pacote do que o job gerou
        if: always()
        shell: bash
        run: |
          mkdir -p out
          tar czf out/app.tar.gz app/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: openbim-ci-windows-sonda
          path: out/
          retention-days: 7  # build de teste, não é versão publicada (decisão do PO, lote opus 2)
      - name: Tempo total
        if: always()
        shell: bash
        run: |
          echo "### windows-sonda: tempo total do job até aqui: $(( $(date +%s) - T0 )) s" >> "$GITHUB_STEP_SUMMARY"

  # Mantém o nome `windows` (regra de bloqueio de merge): passa só se TODOS os jobs paralelos acima passarem.
  windows:
    if: always()
    needs: [windows-testes, windows-obimcore, windows-viewport-a, windows-viewport-b, windows-fluxo-b]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Conferir que todo job do Windows que bloqueia está no needs (T23a)
        run: python3 scripts/conferir_ci_windows.py .github/workflows/ci.yml
      - name: Todos os jobs do Windows passaram
        env:
          RESULTADOS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "resultados: $RESULTADOS"
          for r in $RESULTADOS; do [ "$r" = success ] || { echo "::error title=windows::algum job do Windows não passou ($RESULTADOS)"; exit 1; }; done

  # Instalador do Windows em job próprio: roda ao mesmo tempo que o job windows, em vez de depois dele.
  instalador-windows:
    runs-on: windows-latest
    needs: windows-obimcore  # T17b/T23b: o módulo obimcore é compilado no windows-obimcore e entra no instalador pronto (o pacote não tem compilador)
    env:
      PLAT: win-64
    timeout-minutes: 75  # era 60; o R1-j acrescenta uma instalação e os 9 casos do pytest
    steps:
      - name: Início (relógio)
        shell: bash
        run: echo "T0=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Detecta se o empacotamento mudou (decide se o instalador é montado e testado)
        id: detecta
        shell: bash
        env:
          EVENTO: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
        run: |
          # push (main) e tag: sempre. Pull request: só se o diff contra a base toca o empacotamento, o módulo obimcore ou os testes que o instalador roda (T17b). Na dúvida, true.
          r=true; motivo="evento $EVENTO"
          if [ "$EVENTO" = "pull_request" ]; then
            if git fetch --no-tags --depth=1 origin "$BASE" 2>/dev/null && lista=$(git diff --name-only FETCH_HEAD HEAD); then
              if grep -qE '^(packaging/|app/|prototypes/s04/obimcore/|tests/|environment[^/]*\.yml$|environment\.[^/]*\.lock$|pyproject[^/]*$|\.github/(workflows/ci\.yml|actions/)|scripts/(prune_packages|license_inventory|collect_package_licenses)\.py$|LICENSES/)' <<<"$lista"; then motivo="o PR mexe no empacotamento"; else r=false; motivo="o PR não mexe no empacotamento"; fi
            else motivo="não consegui comparar com a base"; fi
          fi
          echo "instalador=$r" >> "$GITHUB_OUTPUT"
          echo "::notice title=instalador::instalador=$r ($motivo)"
      - name: Módulo obimcore e pytest vindos do job windows-obimcore (T17b/T23b; falha se não vierem)
        if: steps.detecta.outputs.instalador == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/obimcore_pacote
            ${{ runner.temp }}/pytest_site
          key: obimcore-win-${{ github.run_id }}
          fail-on-cache-miss: true
      - name: Cache de pacotes do conda
        if: steps.detecta.outputs.instalador == 'true'
        id: cache_conda
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/conda_pkgs
          key: conda-${{ runner.os }}-${{ hashFiles('environment.yml', 'environment.*.lock', 'packaging/runtime-environment.yml', 'packaging/runtime-environment.*.lock') }}
      - name: Pasta de pacotes do conda
        if: steps.detecta.outputs.instalador == 'true'
        shell: bash
        run: |
          echo "CONDA_PKGS_DIRS=$RUNNER_TEMP/conda_pkgs" >> "$GITHUB_ENV"
          echo "::notice title=cache de pacotes::cache-hit=${{ steps.cache_conda.outputs.cache-hit }}"
      - uses: conda-incubator/setup-miniconda@be893c923ea9cf1cf7cd510fbdde27c7e18cbdcb # v4.1.0
        if: steps.detecta.outputs.instalador == 'true'
        with:
          activate-environment: openbim
          channels: conda-forge
          conda-remove-defaults: "true"
          channel-priority: strict
          miniforge-version: latest
      - name: Instalador Windows (ambiente de runtime e NSIS)
        if: steps.detecta.outputs.instalador == 'true'
        shell: bash -elo pipefail {0}
        run: |
          trap 'rc=$?; if [ $rc -ne 0 ]; then msg=$(tail -n 40 "$RUNNER_TEMP/passo.log" | sed ":a;N;\$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g"); echo "::error title=instalador falhou::$msg"; fi' EXIT
          exec > >(tee "$RUNNER_TEMP/passo.log") 2>&1
          mkdir -p out
          t0=$(date +%s)
          # Ambiente de runtime (o que vai ao usuário): pela trava, se existir (F0-RG-10; PO.md A3); senão pelo .yml
          LOCK="packaging/runtime-environment.${PLAT}.lock"
          if [ -f "$LOCK" ]; then conda create -p "$RUNNER_TEMP/rt" --file "$LOCK" -y -q; echo "::notice title=ambiente de runtime::criado pela trava $LOCK"
          else conda env create -f packaging/runtime-environment.yml -p "$RUNNER_TEMP/rt" -y -q; echo "::notice title=ambiente de runtime::sem trava para ${PLAT}; criado pelo .yml"; fi
          conda list -p "$RUNNER_TEMP/rt" --explicit --md5 > "out/runtime-environment.${PLAT}.lock"
          if [ -f "$LOCK" ] && diff <(grep -v '^#' "$LOCK" | tr -d '\r') <(grep -v '^#' "out/runtime-environment.${PLAT}.lock" | tr -d '\r') >/dev/null; then echo "::notice title=trava do runtime ${PLAT}::igual à do repositório"
          else echo "::notice title=trava do runtime ${PLAT}::ausente ou DIFERENTE da do repositório (atualizar com o conteúdo abaixo)"; echo "=====INICIO-TRAVA-RUNTIME-${PLAT}====="; tr -d '\r' < "out/runtime-environment.${PLAT}.lock"; echo "=====FIM-TRAVA-RUNTIME-${PLAT}====="; fi
          echo "Ambiente de runtime criado em $(( $(date +%s) - t0 )) s" | tee -a "$GITHUB_STEP_SUMMARY"
          # NSIS não vem mais no windows-latest (Server 2025): usa o pacote conda-forge `nsis` (só ferramenta, não entra no instalador)
          conda create -n nsis -c conda-forge --override-channels nsis=3.12=h4c425fd_1 -y -q
          export MAKENSIS="$(find "$(conda info --base)/envs/nsis" -name makensis.exe | head -n 1)"
          echo "makensis: $MAKENSIS"
          OBIMCORE_DIR="$(cygpath -u "$RUNNER_TEMP")/obimcore_pacote" bash packaging/windows/build_installer.sh "$RUNNER_TEMP/rt" "$RUNNER_TEMP/inst-out" 2>&1 | tail -n 45 | tee -a "$GITHUB_STEP_SUMMARY"
          ls -l "$RUNNER_TEMP/inst-out/OpenBIM-Studio-Setup.exe" | tee -a "$GITHUB_STEP_SUMMARY"
          size=$(stat -c %s "$RUNNER_TEMP/inst-out/OpenBIM-Studio-Setup.exe")
          echo "Instalador (T17b, com obimcore): $size bytes; o módulo soma $(cat "$RUNNER_TEMP"/obimcore_pacote/_obimcore*.pyd "$RUNNER_TEMP"/obimcore_pacote/__init__.py | wc -c) bytes sem compressão. Para comparar com o tamanho de antes (sem o módulo), ver o resumo da última execução no main." | tee -a "$GITHUB_STEP_SUMMARY"
          test "$size" -le 600000000 || { echo "::error::instalador acima de 600 MB (ADR-005 §9: não cortar em silêncio, levar ao PO)"; exit 1; }
          cp "$RUNNER_TEMP/inst-out/OpenBIM-Studio-Setup.exe" "$RUNNER_TEMP/inst-out/licencas-coletadas.txt" out/
      - name: R1-j, o módulo dentro do instalador (T17b; instala em silêncio, roda o oráculo e desinstala; bloqueia o merge porque o job instalador-windows é obrigatório)
        if: steps.detecta.outputs.instalador == 'true'
        shell: bash  # sem login: um shell de login ativaria o ambiente conda e poria DLLs dele no PATH do oráculo
        timeout-minutes: 30
        run: |
          set +e
          export MSYS2_ARG_CONV_EXCL='*'  # o bash do Git for Windows não pode reescrever /S, /D= nem _?=
          t0=$(date +%s)
          DEST="$(cygpath -w "$RUNNER_TEMP")\\OpenBIM-ponte"  # sem espaços (o /D= do NSIS não aceita)
          D="$(cygpath -u "$DEST")"
          fim() {  # fim "mensagem": erro com o fim do log do passo
            msg=$(tail -n 45 "$RUNNER_TEMP/ponte-inst.log" 2>/dev/null | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
            echo "::error title=R1-j no instalador falhou::$1 $msg"; exit 1
          }
          "$PWD/out/OpenBIM-Studio-Setup.exe" /S "/D=$DEST" & pid=$!; wait "$pid"; rc=$?  # como o test_installer.sh; o limite é o do passo (30 min)
          [ "$rc" = 0 ] || fim "instalação em silêncio saiu com código $rc"
          t1=$(date +%s)
          OBIM_PYTEST_SITE="$RUNNER_TEMP/pytest_site" timeout 1500 bash packaging/windows/test_instalador_ponte.sh "$DEST" > "$RUNNER_TEMP/ponte-inst.log" 2>&1; rc=$?
          cat "$RUNNER_TEMP/ponte-inst.log"
          [ "$rc" = 0 ] || fim "oráculo reprovou (código $rc)"
          t2=$(date +%s)
          # desinstala para o test_installer.sh começar de uma pasta limpa; _?= faz o desinstalador esperar (sem isso ele devolve o controle logo)
          timeout 300 "$D/Uninstall.exe" /S "_?=$DEST"; rc=$?
          sleep 3; rm -f "$D/Uninstall.exe"
          [ "$rc" = 0 ] || fim "desinstalador saiu com código $rc"
          for x in env app licenses; do [ ! -e "$D/$x" ] || fim "sobrou $x depois de desinstalar"; done
          rmdir "$D" 2>/dev/null
          echo "R1-j no instalador: instalação $((t1-t0)) s, oráculo $((t2-t1)) s, desinstalação $(( $(date +%s)-t2 )) s" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "::notice title=R1-j::obimcore dentro do instalador, R1-a, R1-d, R1-e e R1-i verdes; runtime do Visual C++ compatível (prova 7)"
      - name: Teste do instalador (instala, abre, desinstala)
        if: steps.detecta.outputs.instalador == 'true'
        shell: bash
        timeout-minutes: 30
        run: |
          set +e
          timeout 1500 bash packaging/windows/test_installer.sh "$PWD/out/OpenBIM-Studio-Setup.exe" "$(cygpath -w "$RUNNER_TEMP")\\OpenBIM-teste" > "$RUNNER_TEMP/teste.log" 2>&1
          rc=$?
          cat "$RUNNER_TEMP/teste.log"
          if [ $rc -ne 0 ]; then
            msg=$(tail -n 40 "$RUNNER_TEMP/teste.log" | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
            echo "::error title=teste do instalador falhou (código $rc)::$msg"
            exit $rc
          fi
          echo "Instalação, abertura e desinstalação sem sobras: OK" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.detecta.outputs.instalador == 'true'
        with:
          name: openbim-instalador-windows
          path: out/
          retention-days: 7  # build de teste, não é versão publicada (decisão do PO, lote opus 2)
      - name: Tempo total
        if: always()
        shell: bash
        run: |
          echo "### instalador windows: tempo total do job até aqui: $(( $(date +%s) - T0 )) s" >> "$GITHUB_STEP_SUMMARY"

  # Melhor esforço (R12): falha vira aviso e não entra na regra de bloqueio de merge.

  macos:
    runs-on: macos-14
    continue-on-error: true
    steps:
      - name: Início (relógio)
        shell: bash
        run: echo "T0=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: conda-incubator/setup-miniconda@be893c923ea9cf1cf7cd510fbdde27c7e18cbdcb # v4.1.0
        with:
          environment-file: environment.yml
          activate-environment: openbim
          channels: conda-forge
          conda-remove-defaults: "true"
          channel-priority: strict
          miniforge-version: latest
      - name: Testes
        id: testes
        continue-on-error: true  # macOS é experimental: a falha vira aviso e o job não aparece como falha (monitor do PO)
        shell: bash -elo pipefail {0}
        run: |
          # Em caso de falha, as últimas linhas viram anotação pública (o log completo exige login no GitHub).
          set +e
          QT_QPA_PLATFORM=offscreen pytest -q -rs tests > pytest.log 2>&1
          rc=$?
          cat pytest.log
          if [ $rc -ne 0 ]; then
            msg=$(tail -n 40 pytest.log | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
            echo "::error title=pytest falhou::$msg"
          fi
          exit $rc
      - name: Inventário de licenças e canal
        shell: bash -elo pipefail {0}
        run: |
          mkdir -p out
          python scripts/license_inventory.py out/license-inventory.md --informativo
      - name: Pacote do app esqueleto
        if: always()
        shell: bash
        run: |
          mkdir -p out
          tar czf out/app.tar.gz app/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: openbim-ci-macos
          path: out/
          retention-days: 7  # build de teste, não é versão publicada (decisão do PO, lote opus 2)
      - name: Tempo total
        if: always()
        shell: bash
        run: |
          echo "### macos: tempo total do job até aqui: $(( $(date +%s) - T0 )) s (build limpo, sem cache do ambiente conda; incremental não medido)" >> "$GITHUB_STEP_SUMMARY"
      - name: Aviso (macOS não bloqueia merge)
        if: failure() || steps.testes.outcome == 'failure'
        shell: bash
        run: |
          echo "::warning title=macOS::job macOS falhou; melhor esforço, não bloqueia merge. Registrar o motivo em docs/state/LOG.md."
          echo "AVISO: o job macOS falhou (não bloqueia merge)." >> "$GITHUB_STEP_SUMMARY"

  # Gera o AppImage (pacote Linux) a cada alteração. Bloqueia o merge: o job `appimage` é obrigatório na regra proteger-main. Não renomear.
  appimage:
    runs-on: ubuntu-latest
    needs: linux  # T17a: o módulo obimcore é compilado no job linux e entra no pacote pronto (o pacote não tem compilador)
    timeout-minutes: 45
    steps:
      - name: Início (relógio)
        run: echo "T0=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cache de pacotes do conda
        id: cache_conda
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/conda_pkgs
          key: conda-${{ runner.os }}-${{ hashFiles('environment.yml', 'environment.*.lock', 'packaging/runtime-environment.yml', 'packaging/runtime-environment.*.lock') }}
      - name: Pasta de pacotes do conda
        shell: bash
        run: |
          echo "CONDA_PKGS_DIRS=$RUNNER_TEMP/conda_pkgs" >> "$GITHUB_ENV"
          echo "::notice title=cache de pacotes::cache-hit=${{ steps.cache_conda.outputs.cache-hit }}"
      - uses: conda-incubator/setup-miniconda@be893c923ea9cf1cf7cd510fbdde27c7e18cbdcb # v4.1.0
        with:
          activate-environment: openbim-runtime
          channels: conda-forge
          conda-remove-defaults: "true"
          channel-priority: strict
          miniforge-version: latest
      - name: Criar o ambiente de runtime (pela trava, se existir; F0-RG-10, PO.md A3)
        shell: bash -elo pipefail {0}
        run: |
          PLAT=linux-64
          LOCK="packaging/runtime-environment.${PLAT}.lock"
          if [ -f "$LOCK" ]; then conda install -n openbim-runtime -y -q --file "$LOCK"; echo "::notice title=ambiente de runtime::criado pela trava $LOCK"
          else conda env update -n openbim-runtime -f packaging/runtime-environment.yml -q; echo "::notice title=ambiente de runtime::sem trava para ${PLAT}; criado pelo .yml"; fi
          mkdir -p out
          conda list -n openbim-runtime --explicit --md5 > "out/runtime-environment.${PLAT}.lock"
          if [ -f "$LOCK" ] && diff <(grep -v '^#' "$LOCK" | tr -d '\r') <(grep -v '^#' "out/runtime-environment.${PLAT}.lock" | tr -d '\r') >/dev/null; then echo "::notice title=trava do runtime ${PLAT}::igual à do repositório"
          else echo "::notice title=trava do runtime ${PLAT}::ausente ou DIFERENTE da do repositório (atualizar com o conteúdo abaixo)"; echo "=====INICIO-TRAVA-RUNTIME-${PLAT}====="; tr -d '\r' < "out/runtime-environment.${PLAT}.lock"; echo "=====FIM-TRAVA-RUNTIME-${PLAT}====="; fi
      - name: Módulo obimcore e pytest vindos do job linux (T17a; falha se não vierem)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/obimcore_pacote
            ${{ runner.temp }}/pytest_site
          key: obimcore-${{ github.run_id }}
          fail-on-cache-miss: true
      - name: Ferramenta appimagetool (versão fixa 1.9.1, sha256 conferido)
        run: |
          curl -fsSL -o appimagetool.AppImage https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  appimagetool.AppImage" | sha256sum -c -
          chmod +x appimagetool.AppImage
      - name: Montar o AppImage
        shell: bash -elo pipefail {0}
        run: |
          set +e
          OBIMCORE_DIR="$RUNNER_TEMP/obimcore_pacote" RUNTIME_ENV="$CONDA_PREFIX" bash packaging/linux/build_appimage.sh "$RUNNER_TEMP/ai" "$PWD/appimagetool.AppImage" > ai.log 2>&1
          rc=$?
          tail -n 20 ai.log
          if [ $rc -ne 0 ]; then
            msg=$(tail -n 40 ai.log | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
            echo "::error title=AppImage falhou::$msg"
            exit $rc
          fi
      - name: libfuse2 (o AppImage montado de verdade precisa dela; sem ela o usuário vê o programa não abrir)
        run: sudo apt-get install -y libfuse2t64
      - name: Testar o AppImage (licenças, extração, troca de biblioteca, tamanho)
        run: |
          set +e
          IMG="$RUNNER_TEMP/ai/OpenBIM-Studio-x86_64.AppImage"
          OBIM_EXIGIR_FUSE=1 QT_QPA_PLATFORM=offscreen timeout 900 bash packaging/linux/test_appimage.sh "$IMG" > teste-ai.log 2>&1
          rc=$?
          cat teste-ai.log
          if [ $rc -ne 0 ]; then
            msg=$(tail -n 45 teste-ai.log | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
            echo "::error title=teste do AppImage falhou::$msg"
            exit $rc
          fi
          size=$(stat -c %s "$IMG"); echo "AppImage: $((size/1000000)) MB"
          test "$size" -le 600000000 || { echo "::error::AppImage acima de 600 MB"; exit 1; }
          echo "::notice title=AppImage::$((size/1000000)) MB, testes de licença e troca de biblioteca OK"
          echo "AppImage (T17a, com obimcore): $size bytes; o módulo soma $(cat "$RUNNER_TEMP"/obimcore_pacote/* | wc -c) bytes sem compressão. Para comparar com o tamanho de antes (sem o módulo), ver o resumo da última execução no main." >> "$GITHUB_STEP_SUMMARY"
      - name: R1-j, o módulo dentro do AppImage (T17a; bloqueia o merge porque o job appimage é obrigatório na regra proteger-main)
        run: |
          set +e
          IMG="$RUNNER_TEMP/ai/OpenBIM-Studio-x86_64.AppImage"
          OBIM_PYTEST_SITE="$RUNNER_TEMP/pytest_site" QT_QPA_PLATFORM=offscreen timeout 1500 bash packaging/linux/test_appimage_ponte.sh "$IMG" > ponte-ai.log 2>&1
          rc=$?
          cat ponte-ai.log
          if [ $rc -ne 0 ]; then
            msg=$(tail -n 45 ponte-ai.log | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
            echo "::error title=R1-j no AppImage falhou::$msg"
            exit $rc
          fi
          echo "::notice title=R1-j::obimcore dentro do AppImage, R1-a, R1-d, R1-e e R1-i verdes"
      - name: Empacotar (tar.gz mantém a permissão de executar)
        run: |
          mkdir -p out
          tar -czf out/OpenBIM-Studio-x86_64.AppImage.tar.gz -C "$RUNNER_TEMP/ai" OpenBIM-Studio-x86_64.AppImage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openbim-appimage
          path: out/
          retention-days: 7  # build de teste, não é versão publicada (decisão do PO, lote opus 2)
      - name: Tempo total
        if: always()
        run: |
          echo "::notice title=tempo do job appimage::$(( $(date +%s) - T0 )) s"
          echo "Tempo do job appimage: $(( $(date +%s) - T0 )) s (inclui montar, testar e o R1-j; não inclui a espera pelo job linux)" >> "$GITHUB_STEP_SUMMARY"
