version = 1

# Arquivos sem cabeçalho SPDX próprio (texto, dados, gerados).
[[annotations]]
path = [
  "**/*.md",
  "v2/**",
  "docs/**",
  "LICENSE",
  ".gitignore",
  ".editorconfig",
  ".gitattributes",
  "environment.linux-64.lock",
  "tests/README.md",
]
precedence = "aggregate"
