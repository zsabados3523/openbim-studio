# SPDX-License-Identifier: AGPL-3.0-or-later
# Ambiente de desenvolvimento (provisório, ADR-005 §5). Fonte única: conda-forge.
name: openbim
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.12
  - occt=8.0.1
  # Build do ifcopenshell (ADR-005 §7.1 item 2): o hash e o número do build mudam por sistema, por isso aqui só se fixa o Python (py312*); o build exato fica nos arquivos environment.<sistema>.lock, pelos quais o CI cria o ambiente.
  - ifcopenshell=0.9.0=py312*
  - pyside6=6.11.2
  - qt6-main=6.11.2
  - nanobind=3.1.0
  - pytest
  - cmake
  - ninja
  - cxx-compiler
  # Arquivos de desenvolvimento para compilar contra o IfcOpenShell (cartão F0-S04-T01; ok do PO em 2026-10-12)
  - zlib=1.3.2
  - libxml2-devel=2.15.4
  - libboost-devel=1.90.0
