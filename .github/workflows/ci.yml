# SPDX-License-Identifier: AGPL-3.0-or-later
name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Uma nova alteração cancela a execução anterior do mesmo ramo (evita execuções penduradas).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Os nomes dos jobs linux, windows, appimage e instalador-windows são usados na regra de bloqueio de merge (proteger-main). Não renomear.
  # (macos não bloqueia.)
  linux:
    runs-on: ubuntu-latest
    env:
      PLAT: linux-64
    steps:
      - name: Início (relógio)
        run: echo "T0=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cache de pacotes do conda
        id: cache_conda
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/conda_pkgs
          key: conda-${{ runner.os }}-${{ hashFiles('environment.yml', 'environment.*.lock', 'packaging/runtime-environment.yml', 'packaging/runtime-environment.*.lock') }}
      - name: Pasta de pacotes do conda
        shell: bash
        run: |
          echo "CONDA_PKGS_DIRS=$RUNNER_TEMP/conda_pkgs" >> "$GITHUB_ENV"
          echo "::notice title=cache de pacotes::cache-hit=${{ steps.cache_conda.outputs.cache-hit }}"
      - uses: conda-incubator/setup-miniconda@be893c923ea9cf1cf7cd510fbdde27c7e18cbdcb # v4.1.0
        with:
          activate-environment: openbim
          channels: conda-forge
          conda-remove-defaults: "true"
          channel-priority: strict
          miniforge-version: latest
      - name: Criar o ambiente (pela trava environment.linux-64.lock, se existir)
        shell: bash -elo pipefail {0}
        run: |
          LOCK="environment.${PLAT}.lock"
          if [ -f "$LOCK" ]; then
            envs=$(conda env list); if grep -qE '^openbim[[:space:]]' <<<"$envs"; then conda install -n openbim -y -q --file "$LOCK"; else conda create -n openbim -y -q --file "$LOCK"; fi
            echo "::notice title=ambiente::criado pela trava $LOCK"
          else
            conda env update -n openbim -f environment.yml -q
            echo "::notice title=ambiente::sem trava para ${PLAT}; criado pelo environment.yml"
          fi
      - name: Trava do ambiente (informativo; o líder traz o arquivo ao repositório)
        shell: bash -elo pipefail {0}
        continue-on-error: true
        run: |
          mkdir -p out
          conda list -n openbim --explicit --md5 > "out/environment.${PLAT}.lock"
          if [ -f "environment.${PLAT}.lock" ]; then
            if diff <(grep -v '^#' "environment.${PLAT}.lock" | tr -d '\r') <(grep -v '^#' "out/environment.${PLAT}.lock" | tr -d '\r') >/dev/null; then r="igual à do repositório"; else r="DIFERENTE da do repositório (atualizar)"; fi
          else r="ainda não existe no repositório (trazer o artefato)"; fi
          echo "::notice title=trava ${PLAT}::${r}"
          echo "Trava do ambiente (${PLAT}): ${r}" >> "$GITHUB_STEP_SUMMARY"
      - name: Localidade pt_BR na máquina descartável (T26; bloqueia o merge)
        run: |
          # RG-03: sem a localidade os testes da T26 pulariam sem avisar; agora o passo falha e a chave liga o "pulo vira falha".
          sudo locale-gen pt_BR.UTF-8 >/dev/null 2>&1 || true
          sudo update-locale >/dev/null 2>&1 || true
          locais=$(locale -a); if grep -qi '^pt_BR\.utf-\?8$' <<<"$locais"; then
            echo "OBIM_LOCALIDADE_OBRIGATORIA=1" >> "$GITHUB_ENV"
            echo "::notice title=localidade pt_BR::criada"
          else
            echo "::error title=localidade pt_BR::não foi criada; os testes da T26 e do fluxo B não podem rodar"
            exit 1
          fi
      - name: Testes
        shell: bash -elo pipefail {0}
        run: |
          # Em caso de falha, as últimas linhas viram anotação pública (o log completo exige login no GitHub).
          set +e
          QT_QPA_PLATFORM=offscreen pytest -q -rs tests > pytest.log 2>&1
          rc=$?
          cat pytest.log
          if [ $rc -ne 0 ]; then
            msg=$(tail -n 40 pytest.log | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
            echo "::error title=pytest falhou::$msg"
          fi
          exit $rc
      - name: Testes de tela da S03 e desenho do cubo (tela virtual e Mesa por software; bloqueia o merge)
        shell: bash -elo pipefail {0}
        timeout-minutes: 20
        run: |
          # RG-03: estes testes pulavam sem tela (offscreen). Aqui rodam com Xvfb e Mesa (llvmpipe), e pulo vira falha (OBIM_TELA_OBRIGATORIA=1).
          mkdir -p out/desenho
          # Xvfb e Mesa vêm do próprio runner Ubuntu; se faltar, instala só no runner.
          command -v xvfb-run >/dev/null || sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0
          OBIM_TELA_OBRIGATORIA=1 OBIM_EXIGIR_DESENHO=1 OBIM_PNG_SAIDA=out/desenho LIBGL_ALWAYS_SOFTWARE=1 GALLIUM_DRIVER=llvmpipe \
            QT_QPA_PLATFORM=xcb xvfb-run -a -s "-screen 0 1280x1024x24" \
            pytest -q -rs tests/test_viewport_qrhi.py tests/test_viewport_camera.py tests/test_viewport_malha.py tests/test_viewport_adaptador.py tests/test_viewport_responsivo.py tests/test_viewport_selecao.py
          test -f out/desenho/cubo.png
      - name: Inventário de licenças e canal
        shell: bash -elo pipefail {0}
        run: |
          mkdir -p out
          python scripts/license_inventory.py out/license-inventory.md --informativo
      - name: Módulo obimcore (S04-T03; compila com a ponte e roda o oráculo R1-a a R1-i; bloqueia o merge)
        shell: bash -elo pipefail {0}
        run: |
          # Ambiente criado pela trava (T01); nada é instalado aqui. Build limpo e depois incremental, com os tempos no resumo.
          set +e
          exec > >(tee "$RUNNER_TEMP/obimcore.log") 2>&1
          trap 'rc=$?; if [ $rc -ne 0 ]; then msg=$(tail -n 40 "$RUNNER_TEMP/obimcore.log" | sed ":a;N;\$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g"); echo "::error title=obimcore falhou::$msg"; fi' EXIT
          set -e
          CLEAN=1 bash prototypes/s04/obimcore/build.sh out/s04 | tee "$RUNNER_TEMP/b1.txt"
          touch prototypes/s04/obimcore/ponte.cpp
          bash prototypes/s04/obimcore/build.sh out/s04 | tee "$RUNNER_TEMP/b2.txt"
          echo "obimcore ${RUNNER_OS}: limpo $(grep OBIMCORE "$RUNNER_TEMP/b1.txt") | incremental $(grep OBIMCORE "$RUNNER_TEMP/b2.txt")" >> "$GITHUB_STEP_SUMMARY"
          export PYTHONPATH="$(python -c 'import os; print(os.path.abspath("out/s04"))')"
          export OBIM_CI=1  # liga todas as chaves de obrigatório (pulo vira falha; tests/conftest.py) (T04c entregou versao()["registro_ifc4"])
          QT_QPA_PLATFORM=offscreen pytest -q -rs tests/test_s04_ponte.py
          OBIM_S04_P1_OBRIGATORIO=1 QT_QPA_PLATFORM=offscreen pytest -q -rs tests/test_s04_p1_trava_oraculo.py tests/test_s04_p1_obimcore_oraculo.py
      - name: Entregar o módulo obimcore e o pytest ao job appimage (T17a; usa a ação de cache que já está fixada)
        shell: bash -elo pipefail {0}
        run: |
          # O pytest é só Python puro: vai ao passo de teste do pacote, nunca para dentro dele. Cópia, para não depender do ambiente deste job.
          site="$(python -c 'import _pytest, os; print(os.path.dirname(os.path.dirname(_pytest.__file__)))')"
          mkdir -p "$RUNNER_TEMP/pytest_site" "$RUNNER_TEMP/obimcore_pacote"
          for n in pytest _pytest pluggy iniconfig pygments py.py; do [ -e "$site/$n" ] && cp -a "$site/$n" "$RUNNER_TEMP/pytest_site/"; done
          # Só os dois arquivos do módulo, como estão AGORA (o cache grava no fim do job, depois dos passos que vêm a seguir), e com o RPATH conferido.
          cp out/s04/obimcore/__init__.py out/s04/obimcore/_obimcore*.so "$RUNNER_TEMP/obimcore_pacote/"
          rp="$(LC_ALL=C readelf -d "$RUNNER_TEMP"/obimcore_pacote/_obimcore*.so | sed -n 's/.*\(RPATH\|RUNPATH\)[^[]*\[\(.*\)\]/\2/p')"
          [ "$rp" = '$ORIGIN/../../env/lib' ] || { echo "::error title=RPATH do obimcore::esperava só \$ORIGIN/../../env/lib e achei '$rp'"; exit 1; }
          ls "$RUNNER_TEMP/obimcore_pacote" "$RUNNER_TEMP/pytest_site"
      - name: Guardar obimcore e pytest para o job appimage (a gravação acontece no fim do job, se tudo passar)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/obimcore_pacote
            ${{ runner.temp }}/pytest_site
          key: obimcore-${{ github.run_id }}
          lookup-only: true
      - name: Viewport C++ (S04-T06/T07; bloqueia o merge)
        shell: bash -elo pipefail {0}
        timeout-minutes: 30
        run: |
          # O oráculo abre a tela virtual sozinho em subprocesso (xvfb-run no Linux; no Windows, WARP). Nada na tela real.
          export PYTHONPATH="$(python -c 'import os; print(os.path.abspath("out/s04"))')"
          OBIM_CI=1 pytest -q -rsP tests/test_s04_viewport.py tests/test_s04_viewport_b.py tests/test_s04_cena.py tests/test_s04_selecao.py tests/test_s04_selecao_c.py tests/test_s04_profundidade.py tests/test_s04_fluxo_a.py tests/test_s04_fluxo_a_camera_selecao.py tests/test_s04_metas.py tests/test_s04_abertura.py
          OBIM_CI=1 OBIM_S04_T15_OBRIGATORIO=1 pytest -q -rsP tests/test_s04_t15a_threads_fluxo_a.py
          OBIM_CI=1 OBIM_S04_T15_OBRIGATORIO=1 pytest -q -rsP tests/test_s04_t15b_formas.py
          OBIM_CI=1 OBIM_S04_T15_OBRIGATORIO=1 pytest -q -rsP tests/test_s04_t15c_conferencias.py
          OBIM_CI=1 OBIM_S04_T15_OBRIGATORIO=1 pytest -q -rsP tests/test_s04_t15d_parede_pesada.py
          OBIM_CI=1 OBIM_S04_T15_OBRIGATORIO=1 pytest -q -rsP tests/test_s04_t15e_painel_ausente.py
          OBIM_CI=1 OBIM_S04_T15_OBRIGATORIO=1 pytest -q -rsP tests/test_s04_t15g_postador.py
          OBIM_CI=1 LIBGL_ALWAYS_SOFTWARE=1 GALLIUM_DRIVER=llvmpipe pytest -q -rsP tests/test_s04_viewport_software.py  # aviso de desenho por software (F0-RG-13)
      - name: Fluxo B, paredes em C++ (S04-T13; bloqueia o merge)
        shell: bash -elo pipefail {0}
        timeout-minutes: 20
        run: |
          # Sem janela: compara o IFC da biblioteca C++ com o do fluxo A (saída igual).
          bash prototypes/s04/fluxo_b/build.sh out/s04
          export PYTHONPATH="$(python -c 'import os; print(os.path.abspath("out/s04"))')"
          OBIM_CI=1 pytest -q -rsP tests/test_s04_fluxo_b_paredes.py
      - name: Fluxo B, executável com janela (S04-T14c; bloqueia o merge)
        shell: bash -elo pipefail {0}
        timeout-minutes: 40
        run: |
          # O build.sh do passo anterior já gerou fluxo_b_janela ao lado do módulo. Tela virtual (xvfb-run no Linux; WARP no Windows), nada na tela real.
          # O oráculo roda o fluxo A de referência (roteiro R) e o executável de B com a mesma base; autotestes de localidade, `ler`, corrida e memória sem janela.
          export PYTHONPATH="$(python -c 'import os; print(os.path.abspath("out/s04"))')"
          OBIM_CI=1 OBIM_S04_T14_OBRIGATORIO=1 pytest -q -rsP tests/test_s04_fluxo_b_janela.py
      - name: Sonda da thread de desenho (S04-T05; informativo, não bloqueia)
        shell: bash -elo pipefail {0}
        continue-on-error: true
        timeout-minutes: 5
        run: |
          # Desenho por software (Linux: tela virtual + Mesa; Windows: WARP). Nenhuma janela na tela real.
          mkdir -p out/s04_sonda
          B="$(python -c 'import os; print(os.path.abspath("out/s04_sonda/build"))')"; O="$(python -c 'import os; print(os.path.abspath("out/s04_sonda"))')"
          if [ "${RUNNER_OS}" = "Windows" ]; then GEN=(-A x64); else GEN=(-G Ninja); fi
          cmake -S prototypes/s04/sonda_desenho -B "$B" "${GEN[@]}" -DCMAKE_BUILD_TYPE=Release -DOBIM_SAIDA="$O" -DCMAKE_PREFIX_PATH="$CONDA_PREFIX"
          cmake --build "$B" --config Release
          QT_QPA_PLATFORM=xcb LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s "-screen 0 1280x800x24" python prototypes/s04/sonda_desenho/sonda.py "$O" out/s04_sonda/sonda.json; rc=$?
          cat out/s04_sonda/sonda.json || true
          echo "::notice title=sonda da thread de desenho no ${RUNNER_OS}::$(python -c "import json; r=json.load(open('out/s04_sonda/sonda.json')); print('rc=$rc meta_atingida=%s' % r.get('meta_atingida'), {k:v.get('maior_intervalo_ms') for k,v in r['fases'].items() if isinstance(v,dict)})" || echo sem resultado)"
          echo "Sonda da thread de desenho (${RUNNER_OS}): código $rc, relatório em out/s04_sonda/sonda.json" >> "$GITHUB_STEP_SUMMARY"
          true
      - name: Autoteste do oráculo do instalador Windows (T17b; só bash e Python, sem Windows; bloqueia o merge)
        shell: bash -elo pipefail {0}
        run: |
          out="$(bash packaging/windows/test_instalador_ponte.sh --autoteste)"
          echo "$out"
          [ "$(echo "$out" | tail -n 1)" = ok ] || { echo "::error title=autoteste do oráculo do instalador::a última linha não é 'ok'"; exit 1; }
      - name: REUSE (ferramenta só no CI, ambiente separado)
        shell: bash -elo pipefail {0}
        run: |
          conda create -n reuse -c conda-forge --override-channels reuse=6.2.0 -y
          conda run -n reuse reuse lint
      - name: Gravação do roteiro (experimento T12; não bloqueia)
        shell: bash -elo pipefail {0}
        continue-on-error: true
        run: |
          mkdir -p out/video
          if QT_QPA_PLATFORM=offscreen python tests/video/gravar_roteiro.py out/video docs/acceptance/amostras/casa-simples.ifc; then r=gravou; else r="FALHOU (experimento, não bloqueia)"; fi
          echo "Gravação do roteiro (${RUNNER_OS}): ${r}" >> "$GITHUB_STEP_SUMMARY"
      - name: Pacote do app esqueleto
        run: tar czf out/app.tar.gz app/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openbim-ci-linux
          path: out/
          retention-days: 7  # build de teste, não é versão publicada (decisão do PO, lote opus 2)
      - name: Tempo total
        if: always()
        run: |
          echo "Tempo total do job até aqui: $(( $(date +%s) - T0 )) s" >> "$GITHUB_STEP_SUMMARY"

  # Windows em jobs paralelos (T25). O job `windows` no fim só junta o resultado: o nome é o usado na regra de bloqueio de merge.
  windows-testes:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Início (relógio)
        shell: bash
        run: echo "T0=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/ambiente-windows
      - name: Testes
        shell: bash -elo pipefail {0}
        run: |
          # Em caso de falha, as últimas linhas viram anotação pública (o log completo exige login no GitHub).
          set +e
          QT_QPA_PLATFORM=offscreen pytest -q -rs tests > pytest.log 2>&1
          rc=$?
          cat pytest.log
          if [ $rc -ne 0 ]; then
            msg=$(tail -n 40 pytest.log | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
            echo "::error title=pytest falhou::$msg"
          fi
          exit $rc
      - name: Desenho do cubo com WARP do Direct3D 11 (T25; informativo, não bloqueia)
        shell: bash -elo pipefail {0}
        continue-on-error: true
        run: |
          mkdir -p out/desenho
          set +e
          # Tentativa 1: pede o rasterizador por software (WARP); tentativa 2: adaptador padrão do runner.
          for modo in warp padrao; do
            if [ "$modo" = warp ]; then export QSG_RHI_PREFER_SOFTWARE_RENDERER=1; else unset QSG_RHI_PREFER_SOFTWARE_RENDERER; fi
            OBIM_EXIGIR_DESENHO=1 OBIM_PNG_SAIDA=out/desenho QT_QPA_PLATFORM=windows QSG_RHI_BACKEND=d3d11 \
              pytest -q -s -rs tests/test_viewport_qrhi.py > "out/desenho/pytest-desenho-$modo.log" 2>&1
            rc=$?
            cat "out/desenho/pytest-desenho-$modo.log"
            if [ $rc -eq 0 ] && [ -f out/desenho/cubo.png ]; then r="DESENHA no modo $modo ($(grep 'RHI backend' "out/desenho/pytest-desenho-$modo.log" | head -n 1))"; break; fi
            r="NÃO DESENHA (código $rc, último modo $modo): $(tail -n 3 "out/desenho/pytest-desenho-$modo.log" | tr '\n' ' ' | cut -c1-300)"
          done
          echo "::notice title=desenho do cubo no Windows::${r}"
          echo "Desenho do cubo (Windows): ${r}" >> "$GITHUB_STEP_SUMMARY"
          # T27: reabertura da janela 3D (P17) no Windows, no mesmo modo gráfico em que o laço acima parou. Informativo: o resultado vai ao aviso e ao resumo, nunca bloqueia.
          OBIM_TELA_OBRIGATORIA=1 QT_QPA_PLATFORM=windows QSG_RHI_BACKEND=d3d11 \
            pytest -q -s -rs tests/test_viewport_adaptador.py > out/desenho/pytest-reabertura.log 2>&1
          rc=$?
          cat out/desenho/pytest-reabertura.log
          if [ $rc -eq 0 ]; then r2="PASSOU no modo $modo"; else r2="FALHOU (código $rc, modo $modo): $(tail -n 3 out/desenho/pytest-reabertura.log | tr '\n' ' ' | cut -c1-300)"; fi
          echo "::notice title=reabertura da janela 3D no Windows::${r2}"
          echo "Reabertura da janela 3D, P17 (Windows): ${r2}" >> "$GITHUB_STEP_SUMMARY"
          exit 0
      - name: Inventário de licenças e canal
        shell: bash -elo pipefail {0}
        run: |
          mkdir -p out
          python scripts/license_inventory.py out/license-inventory.md --informativo
      - name: Gravação do roteiro (experimento T12; não bloqueia)
        shell: bash -elo pipefail {0}
        continue-on-error: true
        run: |
          mkdir -p out/video
          if QT_QPA_PLATFORM=offscreen python tests/video/gravar_roteiro.py out/video docs/acceptance/amostras/casa-simples.ifc; then r=gravou; else r="FALHOU (experimento, não bloqueia)"; fi
          echo "Gravação do roteiro (${RUNNER_OS}): ${r}" >> "$GITHUB_STEP_SUMMARY"
      - name: Pacote do que o job gerou
        if: always()
        shell: bash
        run: |
          mkdir -p out
          tar czf out/app.tar.gz app/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: openbim-ci-windows-testes
          path: out/
          retention-days: 7  # build de teste, não é versão publicada (decisão do PO, lote opus 2)
      - name: Tempo total
        if: always()
        shell: bash
        run: |
          echo "### windows-testes: tempo total do job até aqui: $(( $(date +%s) - T0 )) s" >> "$GITHUB_STEP_SUMMARY"

  # T23b: o módulo obimcore do Windows (build limpo + incremental + entrega ao instalador) em trabalho próprio, para o instalador-windows
  # não esperar o windows-viewport-a inteiro. Bloqueia o merge (está no needs de `windows`); a chave do cache e os arquivos são os mesmos de antes.
  windows-obimcore:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Início (relógio)
        shell: bash
        run: echo "T0=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/ambiente-windows
      - name: Módulo obimcore (build limpo, touch ponte.cpp, build incremental; bloqueia o merge; os 21 testes da ponte rodam no windows-viewport-a)
        shell: bash -elo pipefail {0}
        run: |
          # Ambiente criado pela trava (T01); nada é instalado aqui. Build limpo e depois incremental, com os tempos no resumo.
          set +e
          exec > >(tee "$RUNNER_TEMP/obimcore.log") 2>&1
          trap 'rc=$?; if [ $rc -ne 0 ]; then msg=$(tail -n 40 "$RUNNER_TEMP/obimcore.log" | sed ":a;N;\$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g"); echo "::error title=obimcore falhou::$msg"; fi' EXIT
          set -e
          CLEAN=1 bash prototypes/s04/obimcore/build.sh out/s04 | tee "$RUNNER_TEMP/b1.txt"
          touch prototypes/s04/obimcore/ponte.cpp
          bash prototypes/s04/obimcore/build.sh out/s04 | tee "$RUNNER_TEMP/b2.txt"
          echo "obimcore ${RUNNER_OS}: limpo $(grep OBIMCORE "$RUNNER_TEMP/b1.txt") | incremental $(grep OBIMCORE "$RUNNER_TEMP/b2.txt")" >> "$GITHUB_STEP_SUMMARY"
      - name: Entregar o módulo obimcore e o pytest ao job instalador-windows (T17b; usa a ação de cache que já está fixada)
        shell: bash -elo pipefail {0}
        run: |
          # O pytest é só Python puro: vai ao passo de teste do pacote, nunca para dentro dele. Cópia, para não depender do ambiente deste job.
          site="$(cygpath -u "$(python -c 'import _pytest, os; print(os.path.dirname(os.path.dirname(_pytest.__file__)))')")"
          mkdir -p "$RUNNER_TEMP/pytest_site" "$RUNNER_TEMP/obimcore_pacote"
          for n in pytest _pytest pluggy iniconfig pygments packaging colorama py.py; do [ -e "$site/$n" ] && cp -a "$site/$n" "$RUNNER_TEMP/pytest_site/"; done
          # Só o __init__.py e o .pyd, como estão AGORA (o cache grava no fim do job, depois dos passos que vêm a seguir); exatamente um .pyd.
          cp out/s04/obimcore/__init__.py out/s04/obimcore/_obimcore*.pyd "$RUNNER_TEMP/obimcore_pacote/"
          n=$(ls "$RUNNER_TEMP"/obimcore_pacote/_obimcore*.pyd | wc -l)
          [ "$n" = 1 ] || { echo "::error title=obimcore::esperava 1 _obimcore*.pyd e achei $n"; exit 1; }
          ls -l "$RUNNER_TEMP/obimcore_pacote" "$RUNNER_TEMP/pytest_site"
      - name: Guardar obimcore e pytest para o job instalador-windows (a gravação acontece no fim do job, se tudo passar)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/obimcore_pacote
            ${{ runner.temp }}/pytest_site
          key: obimcore-win-${{ github.run_id }}
          lookup-only: true
      - name: Tempo total
        if: always()
        shell: bash
        run: |
          echo "### windows-obimcore: tempo total do job até aqui: $(( $(date +%s) - T0 )) s" >> "$GITHUB_STEP_SUMMARY"

  windows-viewport-a:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Início (relógio)
        shell: bash
        run: echo "T0=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/ambiente-windows
      - name: Módulo obimcore (só o build limpo, para os testes deste job; o incremental e a entrega ao instalador estão no job windows-obimcore)
        shell: bash -elo pipefail {0}
        run: CLEAN=1 bash prototypes/s04/obimcore/build.sh out/s04
      - name: Testes da ponte (S04-T03; oráculo R1-a a R1-i; bloqueia o merge)
        shell: bash -elo pipefail {0}
        run: |
          export PYTHONPATH="$(python -c 'import os; print(os.path.abspath("out/s04"))')"
          export OBIM_CI=1  # liga todas as chaves de obrigatório (pulo vira falha; tests/conftest.py) (T04c entregou versao()["registro_ifc4"])
          QT_QPA_PLATFORM=offscreen pytest -q -rs tests/test_s04_ponte.py
          OBIM_S04_P1_OBRIGATORIO=1 QT_QPA_PLATFORM=offscreen pytest -q -rs tests/test_s04_p1_trava_oraculo.py tests/test_s04_p1_obimcore_oraculo.py
      - name: Viewport C++ (parte A; S04-T06/T07; bloqueia o merge)
        shell: bash -elo pipefail {0}
